
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Orthopedic Urgent Care | Advanced Orthopedics New England</title>
      <meta name="description" content="Delivers an accessible, WCAG 2.0 AA-compliant landing page optimized for seamless deployment and enhanced user experience on Netlify." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      
    </head>

    <body>
      
      <div id="root"></div>
      <!-- Netlify form detection for React SPA -->
      <form name="contact" netlify hidden>
        <input type="text" name="firstName" />
        <input type="text" name="lastName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="location" />
        <input type="text" name="reason" />
      </form>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
